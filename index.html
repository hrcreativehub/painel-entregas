<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#1B130D">
<title>Controle de entregas · HR Creative Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --laranja:#FF6B00; --laranja-claro:#FF8A3A; --laranja-texto:#C24F00;
  --preto:#1B130D; --ink-2:#221810; --panel:#2A1E15; --panel-2:#2F2219; --line:#3A2C21; --line-2:#4A3527;
  --creme:#FAF4E7; --creme-2:#E4D9C9; --muted:#BFB2A3; --dim:#8E8072;
  --ok:#5FD38C; --rev:#F5C451; --adj:#FF7A6B;
  --sans:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--preto);color:var(--creme);font-family:var(--sans);font-size:15px;line-height:1.45;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--laranja-claro);outline-offset:3px}
.glow{position:absolute;left:50%;top:-260px;width:900px;max-width:180vw;height:620px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,107,0,.30),rgba(255,107,0,.08) 55%,rgba(27,19,13,0) 100%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:22px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* topo */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em}
.rec{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:rgba(255,107,0,.12);border:1px solid rgba(255,107,0,.45);font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--laranja-claro);text-transform:uppercase}
.rec i{width:8px;height:8px;border-radius:50%;background:#8E8072}
.rec.is-live i{background:#FF3B30;box-shadow:0 0 0 0 rgba(255,59,48,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}70%{box-shadow:0 0 0 8px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.hero{position:relative;padding:34px 26px 30px}
.hero .c{position:absolute;width:22px;height:22px;border:0 solid var(--laranja)}
.hero .c1{left:0;top:0;border-left-width:2px;border-top-width:2px}
.hero .c2{right:0;top:0;border-right-width:2px;border-top-width:2px}
.hero .c3{left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.hero .c4{right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.eyebrow{margin:0 0 14px;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--laranja);text-transform:uppercase}
h1{margin:0;font-weight:900;font-size:clamp(36px,7vw,64px);line-height:.98;letter-spacing:-.03em;text-wrap:balance}
.sub{margin:14px 0 0;font-size:16px;color:var(--muted)}

/* atalhos */
.shortcuts{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line-2);background:rgba(250,244,231,.06);color:var(--creme);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s}
.chipbtn:hover{background:rgba(250,244,231,.12);border-color:#6A4E3A}
.chipbtn.primary{background:var(--laranja);border-color:var(--laranja);color:var(--preto)}
.chipbtn.primary:hover{background:var(--laranja-claro)}
.chipbtn svg{width:15px;height:15px;flex:0 0 auto}

/* destaque */
.feature{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.next{flex:3 1 340px;background:var(--creme);color:var(--preto);border-radius:22px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.next .k{color:#A84E04}
.next .time{font-weight:900;font-size:54px;line-height:1;letter-spacing:-.03em;color:var(--laranja-texto);font-variant-numeric:tabular-nums}
.next .when{font-family:var(--mono);font-weight:500;font-size:11.5px;color:#5E5148;text-transform:uppercase}
.next .what{flex:1 1 200px;display:flex;flex-direction:column;gap:6px}
.next .piece{font-weight:800;font-size:21px;line-height:1.15}
.next .meta{font-size:14px;color:#4A3D33}
.count{flex:1 1 220px;background:var(--ink-2);border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.count .k{color:var(--muted)}
.count .n{font-weight:900;font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count .n small{font-size:18px;font-weight:600;color:var(--dim)}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.segs span.done{background:var(--laranja)}
.segs span.going{background:rgba(255,107,0,.45)}

/* filtro */
.filter{display:flex;flex-direction:column;gap:10px}
.filter .k{color:var(--dim)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--creme);font-weight:600;font-size:14px;cursor:pointer}
.pbtn:hover{border-color:#6A4E3A}
.pbtn[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:var(--preto)}

/* linha do tempo */
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
h2{margin:0;font-weight:900;font-size:30px;letter-spacing:-.02em}
.tl-head span{font-size:13.5px;color:var(--dim)}
.timeline{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:12px}
.timeline:before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--laranja),var(--line) 40%)}
.empty{margin:0;padding:20px 22px;border-radius:18px;background:var(--ink-2);border:1px solid var(--line);color:var(--muted)}
.card{position:relative;border-radius:20px;background:var(--ink-2);border:1px solid var(--line);transition:background .2s,border-color .2s,box-shadow .2s}
.card.is-open{background:var(--panel);border-color:var(--line-2)}
.card.is-next{border-color:var(--laranja);box-shadow:0 0 0 4px rgba(255,107,0,.14),0 18px 40px rgba(0,0,0,.35)}
.card.is-done{opacity:.62}
.card.is-done.is-open{opacity:1}
.dot{position:absolute;left:-26px;top:24px;width:16px;height:16px;border-radius:50%;background:var(--preto);border:3px solid var(--preto);outline:2px solid var(--line-2)}
.card.is-next .dot{background:var(--laranja);outline-color:var(--laranja)}
.card.is-done .dot{background:var(--ok);outline-color:var(--ok)}
.head{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 20px;background:transparent;border:0;border-radius:20px;text-align:left;cursor:pointer}
.times{display:flex;flex-direction:column;gap:3px;min-width:84px}
.times b{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.times small{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:5px}
.titleline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.type{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.12em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.type.story{color:var(--rev);background:rgba(245,196,81,.14)}
.type.reel{color:var(--laranja-claro);background:rgba(255,107,0,.16)}
.type.video{color:var(--creme);background:rgba(250,244,231,.12)}
.type.fotos{color:#9FC6FF;background:rgba(120,170,255,.14)}
.piece{font-weight:800;font-size:17.5px;line-height:1.2}
.by{font-size:13.5px;color:var(--muted)}
.right{display:flex;align-items:center;gap:12px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--muted);background:rgba(191,178,163,.12)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st-edicao{color:var(--laranja-claro);background:rgba(255,107,0,.16)}
.pill.st-revisao{color:var(--rev);background:rgba(245,196,81,.14)}
.pill.st-ajustes{color:var(--adj);background:rgba(255,122,107,.14)}
.pill.st-aprovado,.pill.st-entregue{color:var(--ok);background:rgba(76,195,122,.14)}
.chev{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--panel-2)}
.chev svg{width:16px;height:16px;transition:transform .25s}
.card.is-open .chev svg{transform:rotate(180deg)}
.detail{padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.detail[hidden]{display:none}
.sep{height:1px;background:var(--line)}
.resumo{margin:0;font-size:15px;color:var(--creme-2)}
.team{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--panel-2);font-size:13.5px}
.tag b{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 8px;border-radius:99px;background:#3D2B1F;font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:.1em;color:var(--laranja-claro)}
.group{display:flex;flex-direction:column;gap:8px}
.group>.label{color:var(--dim);font-size:10.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel);text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.tile:hover{border-color:var(--laranja);background:#33251A}
.tile .ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:rgba(255,107,0,.16)}
.tile .ic svg{width:18px;height:18px}
.tile span{display:flex;flex-direction:column;gap:1px}
.tile strong{font-weight:700;font-size:14.5px}
.tile small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--dim)}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;background:var(--laranja);color:var(--preto);text-decoration:none;font-weight:800;font-size:14px;transition:background .2s}
.doc:hover{background:var(--laranja-claro)}
.doc svg{width:14px;height:14px}
.doc.off{background:transparent;border:1px dashed var(--line-2);color:var(--dim);font-weight:600;cursor:default}
.obs{margin:0;font-family:var(--mono);font-size:12px;color:var(--dim)}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:12.5px;color:var(--dim)}
.foot b{font-family:var(--mono);letter-spacing:.14em;color:var(--laranja)}

/* janela */
dialog{border:0;padding:0;background:transparent;color:var(--preto);max-width:min(460px,calc(100vw - 32px));width:100%;max-height:86vh}
dialog::backdrop{background:rgba(12,8,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:var(--creme);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.55);max-height:86vh;overflow-y:auto}
.sheet-head{padding:22px 22px 6px;display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--creme)}
.sheet-head div{flex:1;display:flex;flex-direction:column;gap:4px}
.sheet-head .label{color:#A84E04}
.sheet-head h3{margin:0;font-weight:900;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.close{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--preto);color:var(--creme);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.close svg{width:16px;height:16px}
.rows{list-style:none;margin:0;padding:12px 22px 24px}
.rows li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #E8DCCB}
.rows li:last-child{border-bottom:0}
.rows .n{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--laranja-texto);padding-top:2px}
.rows .t{display:flex;flex-direction:column;gap:2px}
.rows strong{font-weight:700;font-size:15.5px}
.rows em{font-style:normal;font-size:13.5px;color:#5E5148}
.rows a{color:var(--preto);text-decoration:underline;text-decoration-color:var(--laranja);text-underline-offset:3px;font-weight:700;font-size:15.5px}

@media (max-width:560px){
  .hero{padding:28px 20px 24px}
  .next .time{font-size:46px}
  .head{padding:16px}
  .detail{padding:0 16px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  </div>
</dialog>

(function(){
  var COLS = ['id','peca','tipo','responsavel','revisor','revisao','final','status','obs','producao','camera'];

  var ICONS = {

    entrevistados:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="#FF8A3A" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="#FF8A3A" stroke-width="2" stroke-linecap="round"/></svg>',

  };
  var KIND = { imagens:['Imagens obrigatórias','imagem','imagens'], entrevistados:['Entrevistados','entrevistado','entrevistados'], locais:['Locais','local','locais'] };

  var items = BASE.slice();
  var person = 'Todos';
  var openId = null;
  var lastLive = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
  function pad(n){ n=String(parseInt(n,10)||0); return n.length<2?'0'+n:n; }
  function hhmm(v){
    if(v==null||v==='') return '';
    if(Array.isArray(v)) return pad(v[0])+':'+pad(v[1]||0);
    var s=String(v).trim(), m=s.match(/^(\d{1,2})[:h](\d{2})?/);
    if(m) return pad(m[1])+':'+pad(m[2]||0);
    var d=s.match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);
    return d? pad(d[1])+':'+pad(d[2]) : s;
  }
  function mins(t){ var m=String(t||'').match(/^(\d{2}):(\d{2})$/); return m?(+m[1])*60+(+m[2]):9999; }
  function statusKey(s){
    var n=norm(s);
    if(!n) return 'aguardando';
    if(n.indexOf('feit')===0||n.indexOf('entreg')===0||n==='ok'||n==='finalizado'||n==='publicado'||n==='concluido') return 'entregue';
    if(n.indexOf('aprov')===0) return 'aprovado';
    if(n.indexOf('ajust')===0||n.indexOf('altera')===0) return 'ajustes';
    if(n.indexOf('revis')>=0||n.indexOf('enviad')===0) return 'revisao';
    if(n.indexOf('edi')===0||n.indexOf('em edi')===0) return 'edicao';
    return 'aguardando';
  }
  function isDone(it){ var k=statusKey(it.status); return k==='entregue'; }
  function list(v){
    if(Array.isArray(v)) return v;
    if(!v) return [];
    return String(v).split('|').map(function(x){ return x.trim(); }).filter(Boolean);
  }
  function split(s){ var p=String(s).split('::'); return { t:p[0].trim(), d:(p[1]||'').trim() }; }
  function typeCls(t){ var n=norm(t); return n==='video'?'video':(n==='reel'?'reel':(n==='fotos'||n==='foto'?'fotos':'story')); }
  function names(it){ return [it.responsavel,it.revisor,it.producao,it.camera].join(' e ').split(/\s+e\s+|,/).map(function(x){return x.trim();}).filter(Boolean); }
  function content(it){
    var c = PECAS[it.id] || {};
    var o = {};
    EXTRA.forEach(function(k){ o[k] = (it[k]!=null && String(it[k]).trim()!=='') ? it[k] : c[k]; });
    return o;
  }
  function sorted(){ return items.slice().sort(function(a,b){ return Math.min(mins(a.revisao),mins(a.final))-Math.min(mins(b.revisao),mins(b.final)); }); }
  function today(){
    try{
      var p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
      return { date:p.year+'-'+p.month+'-'+p.day, min:(+p.hour%24)*60+(+p.minute) };
    }catch(e){ return { date:'', min:0 }; }
  }

  function renderStatic(){
    $('eyebrow').textContent = CONFIG.eyebrow;
    $('title').textContent = CONFIG.title;
    $('subtitle').textContent = CONFIG.subtitle;
    document.title = 'Controle de entregas · ' + CONFIG.title;
    $('shortcuts').innerHTML = CONFIG.shortcuts.map(function(s,i){
      var cls = 'chipbtn' + (s.primary?' primary':'');
      if(s.list) return '<button type="button" class="'+cls+'" data-short="'+i+'">'+esc(s.label)+'</button>';
      return '<a class="'+cls+'" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+ARROW+'<span>'+esc(s.label)+'</span></a>';
    }).join('');
  }

  function renderRec(){
    var t = today(), el = $('rec'), txt;
    var upd = lastLive ? ' · ' + lastLive.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}) : '';
    if(t.date === CONFIG.eventDate){ txt = 'REC · Ao vivo' + upd; el.classList.add('is-live'); }
    else if(t.date && t.date < CONFIG.eventDate){ txt = 'Em breve'; el.classList.remove('is-live'); }
    else { txt = 'Encerrado' + upd; el.classList.remove('is-live'); }
    $('rec-text').textContent = txt;
  }

  function render(){
    var all = sorted();
    var done = all.filter(isDone).length;
    var next = null;
    for(var i=0;i<all.length;i++){ if(!isDone(all[i])){ next = all[i]; break; } }

    // destaque
    if(next){
      var sk = statusKey(next.status);
      var useRev = next.revisao && (sk==='aguardando'||sk==='edicao');
      $('next-time').textContent = useRev ? next.revisao : (next.final || next.revisao || '--:--');
      $('next-when').textContent = useRev ? 'Revisão · final ' + next.final : (next.revisao ? 'Final' : 'Entrega');
      $('next-piece').textContent = next.peca;
      $('next-meta').textContent = 'Edição com ' + (next.responsavel||'equipe') + ' · ' + STATUS[sk].label.toLowerCase() + relative(useRev?next.revisao:next.final);
    } else {
      $('next-time').textContent = 'OK';
      $('next-when').textContent = 'Dia concluído';
      $('next-piece').textContent = 'Tudo entregue';
      $('next-meta').textContent = 'Todas as peças do dia foram entregues.';
    }
    $('count').innerHTML = done + '<small> / ' + all.length + '</small>';
    $('segs').innerHTML = all.map(function(it){ var k=statusKey(it.status); return '<span class="'+(k==='entregue'?'done':(k==='aguardando'?'':'going'))+'"></span>'; }).join('');

    // filtro
    var seen = {}, ppl = ['Todos'];
    all.forEach(function(it){ names(it).forEach(function(n){ if(!seen[n]){ seen[n]=1; ppl.push(n); } }); });
    if(ppl.indexOf(person)<0) person = 'Todos';
    $('people').innerHTML = ppl.map(function(n){ return '<button type="button" class="pbtn" data-person="'+esc(n)+'" aria-pressed="'+(n===person)+'">'+esc(n)+'</button>'; }).join('');

    // linha do tempo
    var vis = all.filter(function(it){ return person==='Todos' || names(it).indexOf(person)>=0; });
    if(!vis.length){ $('timeline').innerHTML = '<p class="empty">Nenhuma entrega com '+esc(person)+' neste evento.</p>'; return; }
    $('timeline').innerHTML = vis.map(function(it){
      var k = statusKey(it.status), st = STATUS[k], c = content(it);
      var isOpen = openId===it.id, isNext = next && next.id===it.id;
      var cls = 'card'+(isOpen?' is-open':'')+(isNext?' is-next':'')+(k==='entregue'?' is-done':'');
      var note = it.revisao ? 'Revisão ' + it.revisao : (k==='entregue' ? 'Entregue' : 'Entrega direta');
      var team = [['Edição',it.responsavel],['Revisão',it.revisor],['Produção',it.producao],['Câmera',it.camera]].filter(function(p){return p[1];})
        .map(function(p){ return '<span class="tag"><b>'+p[0].toUpperCase()+'</b>'+esc(p[1])+'</span>'; }).join('');
      var tiles = ['imagens','entrevistados','locais'].map(function(kind){
        var n = list(c[kind]).length; if(!n) return '';
        return '<button type="button" class="tile" data-modal="'+kind+'" data-id="'+esc(it.id)+'"><span class="ic">'+ICONS[kind]+'</span><span><strong>'+KIND[kind][0]+'</strong><small>'+n+' '+(n===1?KIND[kind][1]:KIND[kind][2])+'</small></span></button>';
      }).join('');
      var docs = [];
      if(c.roteiro) docs.push('<a class="doc" href="'+esc(c.roteiro)+'" target="_blank" rel="noopener">Roteiro'+ARROW+'</a>');
      if(c.guia) docs.push('<a class="doc" href="'+esc(c.guia)+'" target="_blank" rel="noopener">Guia de perguntas'+ARROW+'</a>');
      var ready = k==='entregue' || k==='aprovado';
      if(c.exportado && ready) docs.push('<a class="doc" href="'+esc(c.exportado)+'" target="_blank" rel="noopener">Exportado'+ARROW+'</a>');
      else docs.push('<span class="doc off">Exportado · após a entrega</span>');
      return '<article class="'+cls+'" id="card-'+esc(it.id)+'"><span class="dot" aria-hidden="true"></span>'+
        '<button type="button" class="head" data-toggle="'+esc(it.id)+'" aria-expanded="'+isOpen+'" aria-controls="det-'+esc(it.id)+'">'+
          '<span class="times"><b>'+esc(it.final||it.revisao)+'</b><small>'+esc(note)+'</small></span>'+
          '<span class="body"><span class="titleline"><span class="type '+typeCls(it.tipo)+'">'+esc(it.tipo)+'</span><span class="piece">'+esc(it.peca)+'</span></span><span class="by">Edição com '+esc(it.responsavel||'equipe')+'</span></span>'+
          '<span class="right"><span class="pill '+st.cls+'"><i aria-hidden="true"></i>'+st.label+'</span><span class="chev" aria-hidden="true">'+CHEV+'</span></span>'+
        '</button>'+
        '<div class="detail" id="det-'+esc(it.id)+'"'+(isOpen?'':' hidden')+'>'+
          '<div class="sep"></div>'+
          (c.resumo?'<p class="resumo">'+esc(c.resumo)+'</p>':'')+
          (team?'<div class="team">'+team+'</div>':'')+
          (tiles?'<div class="group"><span class="label">No set</span><div class="tiles">'+tiles+'</div></div>':'')+
          '<div class="group"><span class="label">Documentos</span><div class="docs">'+docs.join('')+'</div></div>'+
          (it.obs?'<p class="obs">'+esc(it.obs)+'</p>':'')+
        '</div></article>';
    }).join('');
  }

  function relative(t){
    var n = today();
    if(n.date!==CONFIG.eventDate) return '';
    var diff = mins(t) - n.min;
    if(diff>0 && diff<=180) return ' · em ' + (diff>=60 ? Math.floor(diff/60)+'h'+pad(diff%60) : diff+' min');
    if(diff<=0 && diff>-240) return ' · horário passou';
    return '';
  }

  // janela
  var dlg = $('dlg');
  function openDialog(kindLabel, title, rowsHtml){
    $('dlg-kind').textContent = kindLabel;
    $('dlg-title').textContent = title;
    $('dlg-rows').innerHTML = rowsHtml;
    if(typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
  }
  function closeDialog(){ if(dlg.open){ if(typeof dlg.close==='function') dlg.close(); else dlg.removeAttribute('open'); } }
  $('dlg-close').addEventListener('click', closeDialog);
  dlg.addEventListener('click', function(e){ if(e.target===dlg) closeDialog(); });

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-toggle],[data-person],[data-modal],[data-short]');
    if(!t) return;
    if(t.hasAttribute('data-toggle')){
      var id = t.getAttribute('data-toggle');
      openId = openId===id ? null : id;
      render();
      var b = document.querySelector('[data-toggle="'+id+'"]'); if(b) b.focus();
    } else if(t.hasAttribute('data-person')){
      person = t.getAttribute('data-person'); render();
    } else if(t.hasAttribute('data-modal')){
      var kind = t.getAttribute('data-modal'), it = items.filter(function(x){return x.id===t.getAttribute('data-id');})[0];
      if(!it) return;
      var rows = list(content(it)[kind]).map(function(r,i){ var p=split(r); return '<li><span class="n">'+pad(i+1)+'</span><span class="t"><strong>'+esc(p.t)+'</strong>'+(p.d?'<em>'+esc(p.d)+'</em>':'')+'</span></li>'; }).join('');
      openDialog(KIND[kind][0], it.peca, rows);
    } else if(t.hasAttribute('data-short')){
      var s = CONFIG.shortcuts[+t.getAttribute('data-short')];
      var rows2 = s.list.map(function(r,i){ return '<li><span class="n">'+pad(i+1)+'</span><span class="t"><a href="'+esc(r[2])+'" target="_blank" rel="noopener">'+esc(r[0])+'</a>'+(r[1]?'<em>'+esc(r[1])+'</em>':'')+'</span></li>'; }).join('');
      openDialog(s.label, CONFIG.title, rows2);
    }
  });

  // planilha (somente leitura, JSONP do Google Visualization)
  var seq = 0;
  function fetchSheet(){
    var cb = '__hrSheet'+(++seq), s = document.createElement('script'), finished = false;
    var timer = setTimeout(cleanup, 12000);
    function cleanup(){ finished=true; clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function(resp){ if(finished) return; cleanup(); try{ applySheet(resp); }catch(e){} };
    s.onerror = cleanup;
    s.src = 'https://docs.google.com/spreadsheets/d/'+CONFIG.sheetId+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=1&tq='+encodeURIComponent('select *')+'&_='+Date.now();
    document.body.appendChild(s);
  }
  function cell(c){ if(!c) return ''; if(c.v==null) return c.f||''; return (c.f!=null && typeof c.v!=='string' && !Array.isArray(c.v) && !/^Date\(/.test(String(c.v))) ? c.f : c.v; }
  function applySheet(resp){
    if(!resp || resp.status==='error' || !resp.table || !resp.table.rows) return;
    var labels = (resp.table.cols||[]).map(function(c){ return norm(c.label); });
    var idx = {};
    COLS.concat(EXTRA).forEach(function(k,i){ var j = labels.indexOf(k); idx[k] = j>=0 ? j : (i<COLS.length ? i : -1); });
    var out = [];
    resp.table.rows.forEach(function(r){
      var c = r.c||[], o = {};
      Object.keys(idx).forEach(function(k){ o[k] = idx[k]>=0 ? cell(c[idx[k]]) : ''; });
      o.id = String(o.id||'').trim();
      if(!o.id || norm(o.id)==='id' || !String(o.peca||'').trim()) return;
      o.revisao = hhmm(o.revisao); o.final = hhmm(o.final);
      Object.keys(o).forEach(function(k){ if(typeof o[k]!=='string') o[k] = String(o[k]==null?'':o[k]); o[k]=o[k].trim(); });
      out.push(o);
    });
    if(!out.length) return;
    items = out; lastLive = new Date();
    renderRec(); render();
  }

  renderStatic(); renderRec(); render();
  fetchSheet();
  setInterval(function(){ if(!document.hidden) fetchSheet(); }, CONFIG.refreshMs);
  setInterval(function(){ renderRec(); render(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) fetchSheet(); });
})();
</script>
